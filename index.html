<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("huikao-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>會考五科刷題本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: an answer-card (劃卡) worksheet — one question at a time, bubble options A–D, progress strip like the card's numbered rows */
:root{
  --paper:#fbfaf8; --card:#ffffff; --ink:#22262b; --muted:#6b6560; --line:#efd9dc;
  --mark:#c8394f; --mark-soft:#fbe7ea; --ok:#2f7d55; --ok-soft:#e3f2ea; --bad:#b4442c; --bad-soft:#fbe9e3;
  --s-chi:#a4473a; --s-eng:#2f63a8; --s-math:#7a4fa3; --s-sci:#2d7f74; --s-soc:#a87a1e;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cd-bg:#22262b; --cd-ink:#fbfaf8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17191c; --card:#202327; --ink:#ecebe8; --muted:#a29c96; --line:#3a2c30;
  --mark:#f07a8b; --mark-soft:#3a2128; --ok:#6cc79a; --ok-soft:#1d3329; --bad:#f08f74; --bad-soft:#3a241d;
  --s-chi:#e28a7c; --s-eng:#7fa8e6; --s-math:#b996e0; --s-sci:#6fc4b8; --s-soc:#e0b55c; --cd-bg:#2a2e34; --cd-ink:#ecebe8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17191c; --card:#202327; --ink:#ecebe8; --muted:#a29c96; --line:#3a2c30;
  --mark:#f07a8b; --mark-soft:#3a2128; --ok:#6cc79a; --ok-soft:#1d3329; --bad:#f08f74; --bad-soft:#3a241d;
  --s-chi:#e28a7c; --s-eng:#7fa8e6; --s-math:#b996e0; --s-sci:#6fc4b8; --s-soc:#e0b55c; --cd-bg:#2a2e34; --cd-ink:#ecebe8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  background-image:repeating-linear-gradient(0deg,transparent 0 35px,var(--line) 35px 36px);}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--mark);padding-bottom:10px}
h1{margin:0;font-size:1.65rem;font-weight:900;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-size:1rem;font-weight:700;padding:8px 16px;border:2px solid var(--mark);background:transparent;color:var(--mark);border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--mark);color:var(--card)}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.strip span{height:10px;border-radius:2px;background:var(--line)}
.strip span.ok{background:var(--ok)} .strip span.bad{background:var(--bad)} .strip span.now{background:var(--mark)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.subj{font-weight:700;padding:2px 12px;border-radius:999px;color:var(--card)}
.again{font-weight:700;color:var(--bad)}
.q{font-size:1.3rem;font-weight:500;margin:0;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:1.15rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--mark)}
.bub{flex:none;width:2.1em;height:1.35em;border:2px solid var(--mark);border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:.85rem;color:var(--mark)}
.opt.pick .bub{background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:5px solid var(--ok);background:var(--ok-soft);padding:12px 16px;border-radius:0 6px 6px 0}
.explain.no{border-color:var(--bad);background:var(--bad-soft)}
.explain b{display:block;font-size:1.1rem;margin-bottom:2px}
.next{align-self:flex-end;font:inherit;font-size:1.15rem;font-weight:700;background:var(--mark);color:var(--card);border:0;border-radius:6px;padding:12px 28px;cursor:pointer}
.big{font-size:3.4rem;font-weight:900;font-family:var(--f-num);color:var(--mark);line-height:1}
.center{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:4.5em 1fr 5.5em;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.num{font-family:var(--f-num);text-align:right;font-size:.95rem}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:120px;border-bottom:2px solid var(--line)}
.day{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:stretch}
.day i{display:block;background:var(--mark);border-radius:2px 2px 0 0;min-height:2px}
.day i.zero{background:var(--line)}
.dlab{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;font-family:var(--f-num);font-size:.7rem;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:1.8rem;color:var(--ink)}
.stat span{font-size:.9rem;color:var(--muted)}
h2{margin:0;font-size:1.2rem;font-weight:900}
.pick-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-size:1rem;font-weight:700;padding:6px 16px;border-radius:999px;border:2px solid var(--c);background:var(--card);color:var(--c);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--card)}
.log{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:7.2em 6em 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lrow .num{text-align:left}.lt{color:var(--muted)}
.pill{font-size:.85rem;font-weight:700;text-align:center;padding:2px 8px;border-radius:999px}
.pill.done{background:var(--ok-soft);color:var(--ok)}.pill.part{background:var(--mark-soft);color:var(--mark)}.pill.none{background:var(--bad-soft);color:var(--bad)}
button.lrow{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
button.lrow:hover:not(:disabled),button.lrow[aria-pressed="true"]{background:var(--mark-soft)}
button.lrow.off{cursor:default}
.chip:disabled{opacity:.4;cursor:default}
.hhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hist{display:flex;flex-direction:column;gap:12px}
.hq{border:1.5px solid var(--line);border-left:5px solid var(--ok);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hq.bad{border-left-color:var(--bad)}
.hqq{margin:0;font-size:1.08rem;font-weight:500}
.hans{display:flex;flex-wrap:wrap;gap:4px 18px}
.hexp{font-size:.95rem;color:var(--muted)}
.tok{color:var(--ok)}.tbad{color:var(--bad)}
@media (max-width:480px){.lrow{grid-template-columns:6.4em 5.6em 1fr;font-size:.92rem}.lt{display:none}}
.note{font-size:.9rem;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:1.4rem}.q{font-size:1.18rem}.opt{font-size:1.05rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}

button.row{font:inherit;color:var(--ink);background:transparent;border:0;padding:6px 0;width:100%;text-align:left;cursor:pointer}
button.srow:hover{background:var(--mark-soft)}
.sblock{border-bottom:1px solid var(--line);padding-bottom:4px}
.units{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px 10px}
.row.urow{grid-template-columns:7.5em 1fr 6em;font-size:.95rem}
.lvline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);margin-top:4px}
.tags{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.unit{font-size:.85rem;font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:1px 10px}
.lv2{font-size:.85rem;font-weight:700;color:var(--mark);background:var(--mark-soft);border-radius:999px;padding:1px 10px}
.passage{white-space:pre-wrap;background:var(--paper);border:1.5px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:1.05rem;line-height:1.75}
.passage.small{font-size:.92rem;padding:8px 12px}
.listen{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.listen .next{align-self:auto}
.say{font-style:italic;color:var(--muted);white-space:pre-line}
.listen b{white-space:pre-line}
/* 試題圖片：白底，暗色主題下也看得清楚 */
.qimg{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border-radius:6px;padding:6px}
a+a>.qimg{margin-top:8px}
.dunno{align-self:flex-start;font:inherit;font-size:1rem;color:var(--muted);background:transparent;border:1.5px dashed var(--muted);border-radius:6px;padding:8px 16px;cursor:pointer}
.dunno:hover{color:var(--ink);border-color:var(--ink)}
.slow{background:var(--mark-soft);color:var(--mark);border-radius:6px;padding:8px 12px;font-weight:700}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fastb{font-style:normal;color:var(--bad);font-size:.85rem;font-weight:700;white-space:nowrap}

.cd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--cd-bg);color:var(--cd-ink);border-radius:6px;padding:14px 18px}
.cd-label{font-weight:900;font-size:1.05rem;display:flex;flex-direction:column;line-height:1.3;margin-right:auto}
.cd-label small{font-weight:500;font-size:.82rem;opacity:.75}
.cd-cell{display:flex;align-items:baseline;gap:4px}
.cd-cell b{font-family:var(--f-num);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--cd-ink);min-width:1.4em;text-align:right}
.cd-cell:first-of-type b{color:var(--mark)}
.cd-cell i{font-style:normal;font-size:.9rem;opacity:.8}
@media (max-width:480px){.cd-label{width:100%}.cd-cell b{font-size:1.6rem}}
.tabs{flex-wrap:wrap}
.theme{font:inherit;font-size:1rem;font-weight:700;padding:8px 14px;border:2px solid var(--muted);background:transparent;color:var(--muted);border-radius:999px;cursor:pointer}
.theme:hover{color:var(--ink);border-color:var(--ink)}
.report h3{margin:6px 0 0;font-size:1.05rem;font-weight:900;border-left:4px solid var(--mark);padding-left:8px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.rep-head p{margin:2px 0 0}
.stats.six{grid-template-columns:repeat(3,1fr)}
.tscroll{overflow-x:auto}
.rtable{width:100%;min-width:540px;border-collapse:collapse;font-size:.95rem}
.rtable th[scope=row],.rtable thead th,.rtable td:nth-child(2){white-space:nowrap}
.rtable th,.rtable td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable thead th{font-size:.85rem;color:var(--muted);font-weight:700}
.rtable td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.rtable td:nth-child(3){min-width:9em}
.rbar{display:inline-block;width:5.5em;height:10px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.rbar i{display:block;height:100%}
.vd{font-size:.82rem;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.vd.good{background:var(--ok-soft);color:var(--ok)}.vd.mid{background:var(--mark-soft);color:var(--mark)}.vd.weak{background:var(--bad-soft);color:var(--bad)}.vd.none{color:var(--muted)}
.rtable.top td:first-child{min-width:14em}
.lvrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvrow div{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.lvrow span{font-size:.9rem;color:var(--muted)}.lvrow b{font-size:1.6rem}.lvrow small{color:var(--muted)}
.weeks{display:flex;gap:8px;align-items:flex-end;height:150px;border-bottom:2px solid var(--line);padding-top:6px}
.wk{flex:1;max-width:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.wk i{display:block;width:70%;background:var(--mark);border-radius:2px 2px 0 0}
.wk .num{font-size:.8rem}.wl,.wn{font-size:.7rem;color:var(--muted);white-space:nowrap}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .noprint,#saveNote{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{border:0;padding:0}
  .rbar,.vd,.wk i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stat{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="cd noprint" id="cd" aria-label="距離會考">
    <span class="cd-label">距離 116 年會考<small>2027/5/15（六）</small></span>
    <span class="cd-cell"><b data-u="d">—</b><i>天</i></span><span class="cd-cell"><b data-u="h">—</b><i>時</i></span><span class="cd-cell"><b data-u="m">—</b><i>分</i></span><span class="cd-cell"><b data-u="s">—</b><i>秒</i></span>
  </div>
  <header class="noprint">
    <div>
      <h1>會考刷題本</h1>
      <div class="sub">五科混合每科 3 題，或單科 10 題・錯題會自動再回來</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-play" role="tab" aria-selected="true">今日練習</button>
      <button class="tab" id="tab-prog" role="tab" aria-selected="false">練習紀錄</button>
      <button class="tab" id="tab-rep" role="tab" aria-selected="false">學習報告</button>
    </div>
    <button class="theme" id="themeBtn" type="button"></button>
  </header>
  <main id="view"></main>
  <p class="note" id="saveNote">紀錄儲存中…</p>
</div>
<script src="exam.js"></script>
<script>
/* ===== 設定：部署 Apps Script 後，把網址貼在這裡 ===== */
const API_URL="https://script.google.com/macros/s/AKfycbzWeFgQpbEbA7GRWD1IGNptH5-xD7S_hVLdNrwTS1YAcwrQYBoB0fbJnDts4_JXiEfnbg/exec";           // 例：https://script.google.com/macros/s/xxxx/exec
const API_KEY="12345";  // 要和 Apps Script 裡的 KEY 一樣

// 國文 [id, 單元, 程度(1基礎/2會考型), 題目, 選項, 答案索引, 解析, 附加]
const BANK_CHI=[
["c1","字音字形",1,"「莘莘學子」的「莘」，正確讀音是？",["ㄒㄧㄣ","ㄕㄣ","ㄒㄧㄥ","ㄕㄥ"],1,"「莘莘」讀ㄕㄣ ㄕㄣ，形容人數眾多。很多人誤讀成ㄒㄧㄣ。"],
["c2","字音字形",1,"下列哪一個成語的寫法正確？",["迫不急待","一股作氣","再接再厲","走頭無路"],2,"正確寫法：迫不「及」待、一「鼓」作氣、「走投」無路。再接再「厲」是對的。"],
["c3","修辭",1,"「時間是小偷，偷走了我的青春。」這句話主要用了哪種修辭？",["譬喻","誇飾","排比","設問"],0,"把「時間」說成「小偷」，是用一件事比喻另一件事，屬於譬喻（暗喻）。"],
["c4","修辭",1,"下列哪一句使用了「誇飾」修辭？",["月亮像一盞燈","我餓得可以吞下一頭牛","你知道嗎？他明天要搬家","春天來了，花開了"],1,"人不可能吞下一頭牛，故意把事情說得很誇張，就是誇飾。"],
["c5","詞語成語",1,"下列哪一句的成語用法正確？",["比賽雙方實力懸殊，打得難分難捨","他的演講內容空洞，讓人聽得津津有味","他才剛學游泳就想橫渡海峽，真是不自量力","老師的提醒我都當耳邊風，因此獲益良多"],2,"不自量力＝高估自己的能力，用法正確。其他三句前後意思互相矛盾。"],
["c6","文言文",1,"「有朋自遠方來，不亦樂乎？」的意思是？",["朋友從遠方來，不是也很快樂嗎？","朋友從遠方來，一點也不快樂","朋友不想從遠方來","我要去遠方找朋友玩"],0,"「不亦……乎」是「不也是……嗎」的意思，用反問加強語氣。"],
["c7","文言文",1,"「三人行，必有我師焉。」的意思最接近？",["三個人一起走路比較安全","幾個人同行，其中一定有值得我學習的人","老師一定要有三個人","要找三個人才能學習"],1,"「三」表示多數，不一定是三個；重點是每個人都有值得學習的地方。"],
["c8","國學常識",1,"寫信給父母時，提稱語應該用哪一個？",["膝下","鈞鑒","足下","大鑒"],0,"對父母、祖父母用「膝下」。「鈞鑒」用於長官，「足下」用於平輩。"],
["c9","字音字形",1,"「一曝十寒」的「曝」，正確讀音是？",["ㄅㄠˋ","ㄆㄨˋ","ㄅㄛˊ","ㄆㄨˊ"],1,"「曝」在這裡是曬的意思，讀ㄆㄨˋ。比喻做事沒有恆心。"],
["c10","文言文",1,"「學而不思則罔」的「罔」是什麼意思？",["網子","迷惑而沒有收穫","沒有","危險"],1,"只讀書不思考，就會迷惑而沒有收穫。後半句是「思而不學則殆」。"],
["c11","詞語成語",1,"「螳臂當車」比喻什麼？",["勇敢堅強","不自量力","團結合作","速度很快"],1,"螳螂舉起前腳想擋住車子，比喻自不量力。"],
["c12","詞語成語",1,"下列量詞使用正確的是？",["一則新聞","一匹新聞","一尾新聞","一枚新聞"],0,"新聞、消息用「則」。匹用於馬、布；尾用於魚；枚用於硬幣、郵票。"],
["c13","文言文",1,"「溫故而知新，可以為師矣。」強調的是？",["要常常換老師","複習學過的東西並得到新的體會","只要學新東西就好","老師很溫和"],1,"溫習舊知識，從中得到新理解，就可以當老師了。"],

["c48","閱讀理解",2,"這段文字主要想說明什麼？",["手機對人有害，應該禁止","安排事情的先後順序很重要","早睡就能提升成績","寫功課要寫得很快"],1,"小明只是改變順序，結果就不同，重點在先後順序。",{ps:"小明每天放學先看半小時手機再寫功課，常常寫到很晚。後來他改成先寫功課再看手機，不但能早點睡，成績也進步了。"}],
["c49","閱讀理解",2,"這個故事諷刺的是哪一種人？",["勤勞的農夫","因為怕失敗而什麼都不敢做的人","喜歡種花的人","愛問問題的人"],1,"農夫因為怕各種風險而什麼都不種，結果一定沒收成。諷刺害怕失敗而不行動的人。",{ps:"有人問農夫：「你為什麼不種麥子？」農夫說：「怕天不下雨。」「那種棉花呢？」「怕被蟲吃掉。」「那你到底種了什麼？」「什麼都沒種，這樣最安全。」"}],

["c52","閱讀理解",2,"作者的主張最接近下列哪一項？",["考試一點也不重要","考試是工具，真正目的是提升能力","讀書只是為了考試","不應該考試"],1,"作者特別澄清：不是考試不重要，而是考試只是檢驗的工具。",{ps:"「讀書不是為了考試」這句話常被誤解成考試不重要。其實真正的意思是：考試只是檢驗學習成果的工具，真正的目標是能力的提升。"}],
["c53","閱讀理解",2,"小華星期六下午 4:40 到達，他能不能進館？",["可以，週六有開","不行，已超過最後入館時間","不行，週六休館","可以，還沒到 5 點"],1,"最後入館時間是 16:30，16:40 已經超過，即使還沒閉館也不能進。會考常考這種細節。",{ps:"【開放時間】本館週一休館。週二至週日 9:00–17:00 開放，最後入館時間為 16:30。"}],

["c58","閱讀理解",2,"這段話的主旨是？",["做越多次越有經驗","反思與改進才能累積真正的經驗","不要重複做同一件事","經驗不重要"],1,"只做不檢討叫重複，每次檢討改進才叫經驗。重點是反思改進。",{ps:"一件事做了一百次，不叫經驗，叫重複；做了一百次，並且每次都檢討改進，才叫經驗。"}],

const SUBJ={chi:{n:"國文",c:"var(--s-chi)"},eng:{n:"英文",c:"var(--s-eng)"},math:{n:"數學",c:"var(--s-math)"},sci:{n:"自然",c:"var(--s-sci)"},soc:{n:"社會",c:"var(--s-soc)"}};
const ORDER=["eng","math","sci","chi","soc"];
const RAW={chi:BANK_CHI,eng:BANK_ENG,math:BANK_MATH,sci:BANK_SCI,soc:BANK_SOC};
/* 會考歷屆試題在 exam.js；短文以編號存在 EXAM_PS */
if(typeof BANK_EXAM!=="undefined")for(const s in BANK_EXAM)RAW[s]=RAW[s].concat(BANK_EXAM[s]);
const psOf=v=>typeof v==="number"?EXAM_PS[v]:v;
const BANK=[];
for(const s in RAW)for(const r of RAW[s])BANK.push({id:r[0],s,u:r[1],lv:r[2],t:r[3],o:r[4],a:r[5],e:r[6],ps:r[7]&&psOf(r[7].ps),au:r[7]&&r[7].au,img:r[7]&&r[7].img,ns:r[7]&&r[7].ns,x:r[7]&&r[7].x});
const BYID=Object.fromEntries(BANK.map(q=>[q.id,q]));
const UNITS={};for(const q of BANK){(UNITS[q.s]=UNITS[q.s]||[]);if(!UNITS[q.s].includes(q.u))UNITS[q.s].push(q.u)}
const PER=3, BOXDAYS=[1,3,7], L2_N=15, L2_ACC=0.8;

function today(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return today(d)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function md(d){return (+d.slice(5,7))+"/"+(+d.slice(8))}
const ABCD="ABCD";

const EMPTY=()=>({log:{},cards:{},seen:{},hist:[],up:{},seq:0,sentSeq:0});
let state=EMPTY();
let store=null; const LS="huikao-progress-v1";

function normalize(s){return Object.assign(EMPTY(),s||{})}
function loadLocal(){try{const s=localStorage.getItem(LS);if(s)state=normalize(JSON.parse(s))}catch(e){}}

  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  scheduleSync();

/* 會考型題目：某科基礎題最近 15 題以上答對率達 80% 自動開啟，也可在紀錄頁手動開啟 */
function unlocked(s){
  if(state.up[s])return true;
  const h=state.hist.filter(x=>{const q=BYID[x.id];return q&&q.s===s&&q.lv===1}).slice(-20);
  if(h.length>=L2_N&&h.filter(x=>x.ok).length/h.length>=L2_ACC){state.up[s]="auto";return true}
  return false;
}

let session=null, mode="all";
/* 選項是看圖作答（A）～（D）的題目不打亂；聽力只有三個選項 */
function mk(q,again){const k=[...q.o.keys()];return {q,again,ord:q.ns?k:shuffle(k)}}
function buildSession(){
  const t=today(); let qs=[];
  if(mode==="wrong"){
    qs=shuffle(Object.keys(state.cards).filter(id=>BYID[id])).slice(0,15).map(id=>mk(BYID[id],true));
  }else{
    const subs=mode==="all"?ORDER:[mode], per=mode==="all"?PER:10;
    const last={};for(const x of state.hist)last[x.id]=x.d;
    for(const s of subs){
      const up=unlocked(s);
      /* 會考歷屆題不必等開啟會考型，一開始就會出現 */
      const pool=BANK.filter(q=>q.s===s&&(q.lv===1||up||q.x));
      const due=shuffle(pool.filter(q=>state.cards[q.id]&&state.cards[q.id].due<=t));
      const f1=shuffle(pool.filter(q=>q.lv===1&&!state.seen[q.id]&&!state.cards[q.id]));
      const f2=shuffle(pool.filter(q=>q.lv===2&&!state.seen[q.id]&&!state.cards[q.id]));
      /* 做過的題目：最久沒做的優先，昨天剛做過的排最後 */
      const rest=shuffle(pool.filter(q=>state.seen[q.id]&&!state.cards[q.id])).sort((a,b)=>(last[a.id]||"").localeCompare(last[b.id]||""));
      const n2=Math.max(1,Math.round(per/3));
      const fresh=[...f2.slice(0,n2),...f1,...f2.slice(n2)];
      /* 錯題每科最多佔 1/3（五科混合每科 1 題），其餘留在「錯題複習」 */
      const cap=Math.max(1,Math.floor(per/3));
      const pick=[...due.slice(0,cap),...fresh,...rest,...due.slice(cap)].slice(0,per);
      qs.push(...pick.map(q=>mk(q,!!state.cards[q.id])));
    }
  }
  session={qs,i:0,res:[],picked:null,fastRun:0,fastN:0,t0:0,t0i:-1};
}

function picker(){
  const nw=Object.keys(state.cards).length;
  const opts=[["all","五科混合","var(--mark)"],...ORDER.map(s=>[s,SUBJ[s].n,SUBJ[s].c]),["wrong",`錯題複習（${nw}）`,"var(--bad)"]];
  const node=el(`<div class="pick-row" role="group" aria-label="選擇科別">${opts.map(([k,n,c])=>`<button class="chip" data-m="${k}" aria-pressed="${mode===k}" style="--c:${c}" ${k==="wrong"&&!nw?"disabled":""}>${n}</button>`).join("")}</div>`);
  node.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{mode=b.dataset.m;buildSession();renderPlay()});
  return node;
}

const view=document.getElementById("view");
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}

/* 英文聽力：用裝置內建語音朗讀。排除 macOS 的趣味／老式機器人聲音，挑一個自然的女聲和男聲輪流使用 */
const canSpeak=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
const BAD_VOICES=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|kathy|organ|princess|ralph|trinoids|whisper|wobble|zarvox|superstar|fred|grandma|grandpa|rocko|sandy|shelley|flo\b|eddy|reed|novelty/i;
const FEMALE=["Ava","Samantha","Allison","Susan","Zoe","Nicky","Joelle","Serena","Kate","Karen","Moira","Tessa","Martha","Aria","Jenny","Zira","Google US English","Google UK English Female","Microsoft Aria","Microsoft Jenny"];
const MALE=["Evan","Tom","Aaron","Nathan","Alex","Daniel","Oliver","Arthur","Gordon","Lee","Rishi","Guy","Davis","Microsoft Guy","Microsoft Davis","Microsoft David","Microsoft Mark","Google UK English Male"];
let VOICES={f:null,m:null};
function pickVoices(){
  if(!canSpeak)return;
  const all=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!BAD_VOICES.test(v.name));
  const score=(v,list)=>{const i=list.findIndex(n=>v.name.toLowerCase().startsWith(n.toLowerCase())||v.name.toLowerCase().includes(n.toLowerCase()));if(i<0)return -1;
    return 100-i+(/premium|natural|neural/i.test(v.name)?50:0)+(/enhanced/i.test(v.name)?30:0)+(/en[-_]US/i.test(v.lang)?10:0)};
  const best=list=>all.map(v=>[score(v,list),v]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0])[0]?.[1]||null;
  VOICES.f=best(FEMALE); VOICES.m=best(MALE);
  if(!VOICES.f&&!VOICES.m){VOICES.f=all.find(v=>/en[-_]US/i.test(v.lang))||all[0]||null}
}
if(canSpeak){try{pickVoices();speechSynthesis.addEventListener("voiceschanged",pickVoices)}catch(e){}}
function voiceFor(id){const n=parseInt(String(id).replace(/\D/g,""),10)||0;const want=n%2?"f":"m";return VOICES[want]?want:(VOICES.f?"f":VOICES.m?"m":null)}
function speak(text,rate,id){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();if(!VOICES.f&&!VOICES.m)pickVoices();
    const k0=voiceFor(id);
    /* 會考聽力稿一行一句，M:／W: 分別用男聲、女聲念，Question: 用旁白的聲音 */
    for(const line of text.split("\n")){
      const m=line.match(/^(M|W|Question):\s*(.*)$/), seg=m?m[2]:line;
      const k=m&&m[1]!=="Question"&&VOICES[m[1]==="M"?"m":"f"]?(m[1]==="M"?"m":"f"):k0;
      /* 慢速：語速放慢，並把句子切成 2～3 個字一組，每組之間自然停頓（部分高品質語音不太理會語速設定） */
      const words=seg.split(/\s+/), parts=[];
      if(rate<0.8){for(let w=0;w<words.length;w+=words.length<=4?2:3)parts.push(words.slice(w,w+(words.length<=4?2:3)).join(" "))}else parts.push(seg);
      for(const t of parts){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;
        if(k&&VOICES[k]){u.voice=VOICES[k];u.lang=VOICES[k].lang}
        speechSynthesis.speak(u)}
    }
  }catch(e){}
}

function renderPlay(){
  if(!session)buildSession();
  const {qs,i,res}=session;
  if(!qs.length){view.replaceChildren(picker(),el(`<section class="sheet center"><h2>目前沒有待複習的錯題</h2><p>做錯或按「我不會」的題目會自動收進這裡。</p></section>`));return}
  if(i>=qs.length)return renderDone();
  const {q,again,ord}=qs[i], s=SUBJ[q.s], p=session.picked, done=p!==null;
  if(!done&&session.t0i!==i){session.t0=performance.now();session.t0i=i}
  const strip=qs.map((_,k)=>`<span class="${k<i?(res[k]?'ok':'bad'):k===i?'now':''}"></span>`).join("");
  const opts=ord.map((oi,pos)=>{let c="opt";if(done){if(oi===q.a)c+=" right";else if(oi===p)c+=" wrong pick"}
    return `<button class="${c}" data-oi="${oi}" ${done?"disabled":""}><span class="bub">${ABCD[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join("");
  const right=ABCD[ord.indexOf(q.a)];
  const verdict=p===q.a?"答對了！":p===-1?`沒關係，正確答案是 ${right}`:`正確答案是 ${right}`;
  const node=el(`<section class="sheet">
    <div class="strip" style="grid-template-columns:repeat(${qs.length},1fr)">${strip}</div>
    <div class="meta"><span class="tags"><span class="subj" style="background:${s.c}">${s.n}</span><span class="unit">${esc(q.u)}</span>${q.x?`<span class="lv2">${q.x} 會考</span>`:q.lv===2?'<span class="lv2">會考型</span>':''}${again?'<span class="again">↻ 錯題再練</span>':''}</span><span class="num">第 ${i+1} / ${qs.length} 題</span></div>
    ${session.fastRun>=3&&!done?'<div class="slow">慢慢來，把題目看完再選，答對比答快重要。</div>':''}
    ${q.ps?`<div class="passage">${esc(q.ps)}</div>`:''}
    ${q.au?`<div class="listen">${canSpeak?`<button class="next" id="play">▶ 播放</button><button class="tab" id="slow">慢速播放</button><span class="note">${/^(M|W):/m.test(q.au)?"男女對話":voiceFor(q.id)==="m"?"男聲":"女聲"}</span>`:`<span class="note">這台裝置不能播放聲音，請看句子作答：</span><b lang="en">${esc(q.au)}</b>`}${done&&canSpeak?`<span class="say" lang="en">${esc(q.au)}</span>`:''}</div>`:''}
    ${q.img?[].concat(q.img).map(src=>`<a href="${esc(src)}" target="_blank" rel="noopener" title="點一下看大圖"><img class="qimg" src="${esc(src)}" alt="題目附圖" loading="lazy"></a>`).join(""):''}
    <p class="q">${esc(q.t)}</p>
    <div class="opts">${opts}</div>
    ${done?'':'<button class="dunno" id="dunno">我不會，直接看解析</button>'}
    ${done?`<div class="explain ${p===q.a?'':'no'}"><b>${verdict}</b><span>${esc(q.e)}</span></div><button class="next" id="next">${i+1<qs.length?'下一題':'看這一輪的成績'}</button>`:''}
  </section>`);
  node.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  node.querySelector("#dunno")?.addEventListener("click",()=>answer(-1));
  node.querySelector("#play")?.addEventListener("click",()=>speak(q.au,0.9,q.id));
  node.querySelector("#slow")?.addEventListener("click",()=>speak(q.au,0.5,q.id));
  node.querySelector("#next")?.addEventListener("click",()=>{session.i++;session.picked=null;renderPlay();window.scrollTo({top:0})});
  if(i===0&&!done)view.replaceChildren(picker(),node);else view.replaceChildren(node);
}

function answer(k){
  const {q}=session.qs[session.i], ok=k===q.a, t=today(), id=q.id;
  const sec=Math.round((performance.now()-session.t0)/100)/10;
  const fast=k!==-1&&sec<(q.ps?6:3);
  session.fastRun=fast?session.fastRun+1:0; if(fast)session.fastN++;
  session.picked=k; session.res[session.i]=ok;
  state.seen[id]=1;
  if(ok){const c=state.cards[id];if(c){c.box++;if(c.box>=BOXDAYS.length)delete state.cards[id];else c.due=addDays(t,BOXDAYS[c.box])}}
  else state.cards[id]={box:0,due:addDays(t,1)};
  const L=state.log[t]||(state.log[t]={n:0,c:0,by:{}});
  L.n++; if(ok)L.c++; if(k===-1)L.dk=(L.dk||0)+1; if(fast)L.fast=(L.fast||0)+1;
  const now=new Date(), hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  if(!L.first)L.first=hm; L.last=hm;
  const b=L.by[q.s]||(L.by[q.s]=[0,0]); b[0]++; if(ok)b[1]++;
  state.seq=(state.seq||0)+1; state.hist.push({d:t,h:hm,id,p:k,ok,sec,q:state.seq}); if(state.hist.length>1500)state.hist=state.hist.slice(-1500);
  unlocked(q.s);
  save(); renderPlay();
}

function renderDone(){
  const n=session.res.length, c=session.res.filter(Boolean).length;
  const wrong=n-c;
  const node=el(`<section class="sheet center">
    <div class="big">${c} / ${n}</div>
    <h2>${c===n?'全對！今天超強':c>=n*0.7?'做得很好，繼續保持':'完成了！每天做就會進步'}</h2>
    <p>${mode==="wrong"?`還有 ${Object.keys(state.cards).length} 題待複習錯題。連續答對幾次就會移出錯題本。`:wrong?`答錯或不會的 ${wrong} 題，之後會再出現，也可以按「錯題複習」先練，記得看解析。`:'這一輪沒有錯題，明天會出新題目。'}</p>
    ${session.fastN>=3?`<p class="slow">這一輪有 ${session.fastN} 題作答很快，下次可以把題目看完再選。</p>`:''}
    <div class="btn-row">
      <button class="next" id="more">再做一輪</button>
      <button class="tab" id="seeProg">看練習紀錄</button>
    </div></section>`);
  node.querySelector("#more").onclick=()=>{buildSession();renderPlay()};
  node.querySelector("#seeProg").onclick=()=>setTab("prog");
  const t=today(), L=state.log[t]; if(L&&!session.counted){session.counted=true;L.r=(L.r||0)+1; save();}
  view.replaceChildren(node,picker());
}

let histDay=null, histWrong=false, openSub=null;
function unitStats(s){
  const m={};for(const u of UNITS[s])m[u]=[0,0];
  for(const x of state.hist){const q=BYID[x.id];if(q&&q.s===s){m[q.u][0]++;if(x.ok)m[q.u][1]++}}
  return m;
}
function renderProg(){
  const t=today(), days=[];
  for(let k=13;k>=0;k--)days.push(addDays(t,-k));
  const max=Math.max(15,...days.map(d=>state.log[d]?.n||0));
  let streak=0;for(let k=0;k<400;k++){const d=addDays(t,-k);if(state.log[d]?.n)streak++;else if(k===0)continue;else break}

function weekKey(d){const x=new Date(d+"T12:00:00");const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return today(x)}
function repData(){
  const since=repRange?addDays(today(),-(repRange-1)):"0000";
  const H=state.hist.filter(x=>{const q=BYID[x.id];return q&&q.s===repSub&&x.d>=since});
  const n=H.length,c=H.filter(x=>x.ok).length,dk=H.filter(x=>x.p===-1).length;
  const ans=H.filter(x=>x.p!==-1&&x.sec!=null);
  const avg=ans.length?ans.reduce((a,x)=>a+Math.min(x.sec,120),0)/ans.length:0;
  const fast=ans.filter(x=>x.sec<(BYID[x.id].ps?6:3)).length;
  const days=new Set(H.map(x=>x.d)).size;
  const units=UNITS[repSub].map(u=>{const h=H.filter(x=>BYID[x.id].u===u),un=h.length,uc=h.filter(x=>x.ok).length,ud=h.filter(x=>x.p===-1).length;
    const ua=h.filter(x=>x.p!==-1&&x.sec!=null);return {u,n:un,c:uc,dk:ud,r:un?Math.round(uc/un*100):null,avg:ua.length?ua.reduce((a,x)=>a+Math.min(x.sec,120),0)/ua.length:null}});
  const lv=[1,2].map(l=>{const h=H.filter(x=>BYID[x.id].lv===l);return {n:h.length,c:h.filter(x=>x.ok).length}});
  const wk={};for(const x of H){const k=weekKey(x.d);(wk[k]=wk[k]||[0,0]);wk[k][0]++;if(x.ok)wk[k][1]++}
  const weeks=Object.keys(wk).sort().slice(-8).map(k=>({k,n:wk[k][0],r:Math.round(wk[k][1]/wk[k][0]*100)}));
  const miss={};for(const x of H){if(!x.ok){(miss[x.id]=miss[x.id]||{n:0,picks:{}});miss[x.id].n++;const pk=x.p===-1?"不會":BYID[x.id].o[x.p];miss[x.id].picks[pk]=(miss[x.id].picks[pk]||0)+1}}
  const tries={};for(const x of H)tries[x.id]=(tries[x.id]||0)+1;
  const top=Object.entries(miss).sort((a,b)=>b[1].n-a[1].n).slice(0,15).map(([id,m])=>({q:BYID[id],n:m.n,t:tries[id],pick:Object.entries(m.picks).sort((a,b)=>b[1]-a[1])[0][0]}));
  const inBook=Object.keys(state.cards).filter(id=>BYID[id]&&BYID[id].s===repSub).length;
  const seenS=Object.keys(state.seen).filter(id=>BYID[id]&&BYID[id].s===repSub).length;
  return {n,c,dk,avg,fast,days,units,lv,weeks,top,inBook,seenS,ansN:ans.length,since};
}

/* ===== 雲端同步（Google Apps Script） ===== */
let syncTimer=null, syncing=false;
function rowsToSend(){
  return state.hist.filter(x=>x.q>(state.sentSeq||0)).map(x=>{const q=BYID[x.id];
    return {q:x.q,d:x.d,h:x.h,s:SUBJ[q.s].n,u:q.u,lv:q.lv===2?"會考型":"基礎",id:x.id,t:(q.au?"[聽力] "+q.au+" ／ ":"")+q.t,
      p:x.p===-1?"我不會":q.o[x.p],a:q.o[q.a],ok:x.ok?"對":x.p===-1?"不會":"錯",sec:x.sec}});
}
function scheduleSync(){if(!API_URL)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!API_URL||syncing)return;syncing=true;
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"sync",key:API_KEY,state,rows:rowsToSend()})});
    const j=await res.json();
    if(j.ok){if(j.lastSeq!=null){state.sentSeq=Math.max(state.sentSeq||0,j.lastSeq);try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
      note.textContent="紀錄已同步，爸媽的 LINE 和試算表都看得到。"}
    else note.textContent="同步失敗："+(j.error||"未知原因")+"，紀錄先存在這台裝置。";
  }catch(e){note.textContent="現在沒有網路，紀錄先存在這台裝置，下次會自動補傳。"}
  syncing=false;
}
async function pullRemote(){
  if(!API_URL){note.textContent="紀錄存在這台裝置上（還沒設定雲端同步）。";return}
  try{
    const res=await fetch(API_URL+"?key="+encodeURIComponent(API_KEY));const j=await res.json();
    if(j.state){const d=normalize(j.state);
      if(d.resetAt&&d.resetAt!==state.resetAt){state=EMPTY();state.resetAt=d.resetAt;session=null}
      const byQ=new Map();for(const x of [...d.hist,...state.hist])byQ.set(x.d+"|"+x.h+"|"+x.id+"|"+x.q,x);
      const hist=[...byQ.values()].sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h)).slice(-1500);
      const merged={log:Object.assign({},d.log),cards:Object.assign({},d.cards,state.cards),seen:Object.assign({},d.seen,state.seen),
        hist,up:Object.assign({},d.up,state.up),resetAt:d.resetAt||state.resetAt,
        seq:Math.max(d.seq||0,state.seq||0),sentSeq:Math.max(d.sentSeq||0,state.sentSeq||0)};
      for(const k in state.log){if(!merged.log[k]||merged.log[k].n<state.log[k].n)merged.log[k]=state.log[k]}
      state=merged;
    }
    try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
    await syncNow();
    const cur=["play","prog","rep"].find(t=>document.getElementById("tab-"+t).getAttribute("aria-selected")==="true");
    if(cur==="prog")renderProg();else if(cur==="rep")renderRep();else if(!session||(session.i===0&&session.picked===null)){session=null;renderPlay()}
  }catch(e){note.textContent="現在連不到雲端，紀錄先存在這台裝置。"}
}
window.addEventListener("online",syncNow);

setTab(location.hash==="#report"?"rep":location.hash==="#progress"?"prog":"play");
pullRemote();
</script>
</body>
